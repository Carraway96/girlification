<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Girlification - Prototyp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topline">
      <h1>Girlification</h1>
      <p>Lägenhetsförsvar mot mjuk, obeveklig hemmamys-eskalering.</p>
    </header>

    <canvas id="gameCanvas" width="1000" height="640" aria-label="Girlification spelduk"></canvas>

    <section class="help">
      <strong>Kontroller:</strong> Flytta med <kbd>WASD</kbd>, interagera med <kbd>E</kbd>, specialer: <kbd>Q</kbd> Garderobsrush och <kbd>F</kbd> Lugnt snack, välj åtgärd med <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd>, stäng meny med <kbd>Esc</kbd>, starta om med <kbd>R</kbd>.
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
